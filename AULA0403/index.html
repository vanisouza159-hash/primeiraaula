<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>

/* Fundo simples */
body{
  height:200;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f0f0f0;
}

/* Cartão */
.card{
  background:white;
  padding:20px;
  width:200px;
  text-align:center;
  border-radius:10px;
  transition:0.3s;
  position:relative;
}

/* Aumenta no hover */
.card:hover{
  transform:scale(1.1);
}

/* Descrição escondida */
.desc{
  opacity:0;
  transition:0.3s;
}

.card:hover .desc{
  opacity:1;
}

/* 🔴 Quadrado animado */
.box{
  width:50px;
  height:50px;
  background:rgb(0, 115, 255);
  position:relative;
  animation: mover 4s infinite alternate;
  margin:10px auto;
}

@keyframes mover{
  0%{ transform:translateY(0); }
  100%{ transform:translateY(50px); }
}

/* Botão */
button{
  margin-top:10px;
  padding:5px 15px;
  border:none;
  background:rgb(0, 255, 110);
  color:white;
  border-radius:5px;
  transition:0.3s;
}

button:active{
  transform:scale(0.9);
}

</style>
</head>
<body>

<div class="card">
  <h3>Cartão</h3>

  <div class="box"></div>

  <div class="desc">Descrição aparece aqui</div>

  <button>Clique</button>
</div>

</body>
</html>
